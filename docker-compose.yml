version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_donasi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Backend Service
  backend-app:
    image: ghcr.io/zero-sensei03/web-donasi-backend:latest # Sesuaikan nama image backend kamu
    container_name: backend-app-6001
    restart: always
    ports:
      - "6001:6001" # Sesuaikan port backend kamu
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://user:password@postgres-db:5432/db_donasi?sslmode=disable"
      PORT: 6001

      CORS_ORIGIN: "*"
    depends_on:
      - postgres-db
    networks:
      - app-network

# Network bersama agar semua service bisa saling komunikasi via nama service (contoh: host=postgres)
networks:
  app-network:
    driver: bridge

# Volume persisten agar data PostgreSQL tidak hilang saat container direstart/rebuild
volumes:
  postgres_data: